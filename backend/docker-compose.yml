version: "3.8"
services:
  db:
    image: postgres:16-alpine
    container_name: aifindops_db
    environment:
      POSTGRES_USER: aifindops
      POSTGRES_PASSWORD: password
      POSTGRES_DB: aifindops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
